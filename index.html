<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yumo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7fb;--ink:#1e2a3b;--mut:#5d6b80;--acc:#4a78c9;--glass:rgba(255,255,255,.62);--edge:rgba(255,255,255,.9);--line:rgba(30,42,59,.09);--flash:rgba(120,170,235,.35);--bs:60%;--bl:90%;--bo:1;--ss:62%;--sl:80%;--sh:0 18px 44px rgba(60,90,140,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1520;--ink:#e6edf7;--mut:#95a3b8;--acc:#8fb4ff;--glass:rgba(34,46,66,.55);--edge:rgba(255,255,255,.14);--line:rgba(255,255,255,.1);--flash:rgba(143,180,255,.3);--bs:28%;--bl:17%;--bo:1;--ss:34%;--sl:27%;--sh:0 18px 44px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0e1520;--ink:#e6edf7;--mut:#95a3b8;--acc:#8fb4ff;--glass:rgba(34,46,66,.55);--edge:rgba(255,255,255,.14);--line:rgba(255,255,255,.1);--flash:rgba(143,180,255,.3);--bs:28%;--bl:17%;--bo:1;--ss:34%;--sl:27%;--sh:0 18px 44px rgba(0,0,0,.35)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:100%/1.55 'JetBrains Mono','JetBrainsMono Nerd Font','JetBrainsMono NF','JetBrains Mono NL',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;overflow:hidden}.wipe{position:absolute;inset:0}#shapes{position:fixed;inset:0;pointer-events:none;overflow:hidden}.shape{position:absolute}.s{width:100%;height:100%;box-sizing:border-box;transition:background-color .9s,border-color .9s,color .9s}.s svg{width:100%;height:100%;display:block}.s.circle{border-radius:50%}.s.ring{border-radius:50%;border:1.6vmin solid}.s.square{border-radius:14%}.s.tri{clip-path:polygon(50% 0,100% 100%,0 100%)}.s.half{height:50%;border-radius:999px 999px 0 0}.s.quarter{border-radius:100% 0 0 0}
#stage{position:fixed;inset:0}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:24px 24px 64px;text-align:center}
.big{font-size:clamp(2.1rem,7.4vw,6rem);font-weight:800;line-height:1.05;letter-spacing:-.05em}
.big.soft{color:var(--mut)}
.huge{font-size:clamp(1.6rem,4.9vw,3.8rem);font-weight:800;line-height:1.1;letter-spacing:-.05em}
.title{font-size:clamp(1.5rem,3.8vw,2.7rem);font-weight:800;line-height:1.12;letter-spacing:-.05em;margin:0 0 1.2vh}
.title.left{text-align:left;max-width:15ch}
.wd{display:inline-block;margin:0 .1em}.acc{color:var(--acc)}
.small{font-size:clamp(.95rem,1.8vw,1.25rem);color:var(--mut);letter-spacing:.005em;line-height:1.45;max-width:46ch}
.mono{letter-spacing:0}
.kicker{font-size:.8rem;font-weight:600;color:var(--acc);letter-spacing:.01em}
.glass{background:var(--glass);border:1px solid var(--line)}
.status{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600;color:var(--mut)}
.status i{width:8px;height:8px;border-radius:50%;background:#6cc4a8;box-shadow:0 0 0 4px rgba(108,196,168,.25)}
.row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;max-width:900px;margin-top:1.5vh}.row.tight{gap:10px}
.slot{display:block}
.grab{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;transition:scale var(--sprd,400ms) var(--spr,ease-out)}.grab:hover{scale:1.045}.grab.held{scale:.93;cursor:grabbing}
.card{width:min(300px,80vw);padding:24px;border-radius:16px;text-align:left}
.card b{display:block;font-size:1.2rem;letter-spacing:-.02em}.card p{margin:8px 0 14px;color:var(--mut);font-size:.95rem;line-height:1.45}.card i{font-style:normal;font-size:.8rem;font-weight:600;color:var(--acc)}
.logo.glass{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 10px;font-size:.8rem;font-weight:500;color:var(--ink)}.row.logos{gap:14px 22px;margin-top:.5vh}.chip{padding:10px 16px;border-radius:10px;font-weight:600;font-size:clamp(.95rem,1.8vw,1.2rem)}
.split{display:flex;align-items:center;justify-content:center;gap:clamp(24px,5vw,64px);flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px;align-items:flex-start;text-align:left;max-width:380px}
.fact{font-size:1rem;color:var(--mut);padding-left:14px;border-left:2px solid var(--acc);line-height:1.4}
.lanes{position:relative;display:flex;width:216px;height:300px;border-radius:16px;overflow:hidden}
.lane{flex:1;position:relative;border-right:1px solid var(--line)}.lane:last-of-type{border-right:0}
.note{position:absolute;left:8px;right:8px;top:0;height:22px;border-radius:7px;background:#9ec3f2}.n1,.n2{background:#a9dcca}.n3{background:#b7b6ec}
.hit{position:absolute;left:0;right:0;bottom:54px;height:3px;background:var(--acc);opacity:.7;border-radius:2px}
.ledger{width:min(640px,92vw);text-align:left}
.rowl{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:13px 4px;border-bottom:1px solid var(--line)}
.rowl b{display:block;font-size:1.05rem;letter-spacing:-.01em}.rowl span{font-size:.85rem;color:var(--mut)}.rowl em{font-style:normal;font-weight:650;color:var(--acc);text-align:right;font-size:.95rem}
.btn{font:inherit;font-weight:600;font-size:.95rem;padding:12px 20px;border-radius:12px;color:var(--ink);text-decoration:none;cursor:pointer;border:1px solid var(--line);transition:scale var(--sprd,400ms) var(--spr,ease-out),rotate var(--sprd,400ms) var(--spr,ease-out)}
.btn:hover{scale:1.09;rotate:-1.2deg}.btn:active{scale:.88;rotate:0deg}.btn.primary{background:var(--acc);color:#fff;border-color:transparent}
#dots{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;gap:8px;justify-content:center}
.dot{width:8px;height:8px;padding:0;border:0;border-radius:4px;background:var(--mut);opacity:.35;cursor:pointer;transition:width var(--sprd,450ms) var(--spr,ease-out),opacity .3s,scale var(--sprd,450ms) var(--spr,ease-out)}.dot:hover{scale:1.7}.dot:active{scale:.7}.dot.on{width:26px;opacity:.9;background:var(--acc)}
.rowl{transform-origin:left center;transition:scale var(--sprd,400ms) var(--spr,ease-out)}.rowl:hover{scale:1.03}
.fact{transition:translate var(--sprd,400ms) var(--spr,ease-out)}.fact:hover{translate:10px 0}
.ripple{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid var(--acc);pointer-events:none;z-index:5}
@media (prefers-reduced-transparency:reduce){.glass{background:var(--bg)}}
@media (prefers-contrast:more){.glass{background:var(--bg);border-color:var(--ink)}}
@media (prefers-reduced-motion:reduce){#bg{transition:none}}
</style></head><body>
<div id="bg"></div><div id="stage"></div><nav id="dots"></nav>
<script>
/* Yumo — motion intro. Springs follow the "damping + response" model (critically damped by default,
   bounce only where momentum exists). Needs #bg, #stage, #dots and the CSS in index.html. */
(() => {
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), bg = $('bg'), dots = $('dots');
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  let run = 0, cur = 0;

  /* damping ratio + response (seconds) -> linear() easing */
  const cache = {};
  function spring(ratio = 1, resp = 0.5) {
    const key = ratio + '/' + resp;
    if (cache[key]) return cache[key];
    const w = (2 * Math.PI) / resp, k = w * w, c = 2 * ratio * w, dt = 1 / 120;
    let x = 0, v = 0, t = 0, n = 0, calm = 0, pts = [0];
    while (t < 4 && calm < 20) {
      v += (-k * (x - 1) - c * v) * dt; x += v * dt; t += dt;
      if (++n % 2 === 0) pts.push(+x.toFixed(4));
      calm = Math.abs(x - 1) < 0.001 && Math.abs(v) < 0.01 ? calm + 1 : 0;
    }
    pts.push(1);
    return (cache[key] = { duration: t * 1000, easing: 'linear(' + pts.join(',') + ')' });
  }
  function pop(el, o = {}) {
    const { delay = 0, from = 'translateY(52px) scale(.82)', ratio = 0.48, resp = 0.55 } = o;
    el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay, fill: 'both', easing: 'ease-out' });
    if (RM) return;
    const s = spring(ratio, resp);
    el.animate([{ transform: from }, { transform: 'none' }], { duration: s.duration, easing: s.easing, delay, fill: 'both' });
  }

  function h(cls, html = '', parent = stage, tag = 'div') {
    const e = document.createElement(tag); e.className = cls; e.innerHTML = html; parent.appendChild(e); return e;
  }
  function words(text, cls, parent, base = 0, gap = 80, o = {}) {
    const w = h(cls, '', parent);
    text.split(' ').forEach((t, i) => pop(h('wd' + (t[0] === '*' ? ' acc' : ''), t.replace('*', ''), w, 'span'), { delay: base + i * gap, from: `translateY(58px) scale(.72) rotate(${i % 2 ? 5 : -5}deg)`, ratio: 0.45, resp: 0.5, ...o }));
    return w;
  }

  /* ---------- drag: 1:1 tracking, rubber-band edges, velocity handed to a spring on release ---------- */
  const D = 260, C = 0.55;
  const band = (o) => (o * D * C) / (D + C * Math.abs(o));
  const unband = (r) => { const m = Math.max(-D * 0.98, Math.min(D * 0.98, r)); return (m * D) / (C * (D - Math.abs(m))); };
  function drag(el) {
    const w = (2 * Math.PI) / 0.5, k = w * w, c = 2 * 0.36 * w;
    let x = 0, y = 0, vx = 0, vy = 0, sx = 0, sy = 0, raf = 0, last = 0, hist = [], on = false;
    const draw = () => { el.style.translate = `${x}px ${y}px`; el.style.rotate = `${Math.max(-14, Math.min(14, x * 0.035 + vx * 0.006))}deg`; };
    const tick = (t) => {
      const dt = Math.min((t - last) / 1000, 1 / 30); last = t;
      vx += (-k * x - c * vx) * dt; vy += (-k * y - c * vy) * dt; x += vx * dt; y += vy * dt; draw();
      if (Math.abs(x) + Math.abs(y) + Math.abs(vx) + Math.abs(vy) < 0.05) { x = y = vx = vy = 0; draw(); return; }
      raf = requestAnimationFrame(tick);
    };
    el.addEventListener('pointerdown', (e) => {
      cancelAnimationFrame(raf); el.setPointerCapture(e.pointerId); on = true; hist = [];
      el.classList.add('held'); sx = e.clientX - unband(x); sy = e.clientY - unband(y); // keep grab offset, interrupt mid-flight
    });
    el.addEventListener('pointermove', (e) => {
      if (!on) return;
      x = band(e.clientX - sx); y = band(e.clientY - sy); draw();
      hist.push([performance.now(), x, y]); if (hist.length > 8) hist.shift();
    });
    const up = () => {
      if (!on) return; on = false; el.classList.remove('held');
      const a = hist[0], b = hist[hist.length - 1], now = performance.now();
      if (a && b && now - b[0] < 80 && b[0] > a[0]) { vx = ((b[1] - a[1]) / (b[0] - a[0])) * 1000; vy = ((b[2] - a[2]) / (b[0] - a[0])) * 1000; }
      last = now; raf = requestAnimationFrame(tick);
    };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  }
  const grabbable = (html, cls, parent, delay, from, o = {}) => {
    const slot = h('slot', '', parent), el = h(cls + ' glass grab', html, slot);
    pop(slot, { delay, from, ...o }); drag(el); return el;
  };

  /* ---------- background: flat pastel colour wipes + floating shapes ---------- */
  const shapesEl = h('', '', document.body); shapesEl.id = 'shapes'; bg.after(shapesEl);
  const PAL = [[205,[165,260,340,45]],[160,[205,290,40,330]],[265,[190,150,340,50]],[195,[260,330,150,45]],[330,[200,160,265,45]],[48,[200,160,330,265]],[215,[150,265,340,45]],[275,[170,205,335,48]]];
  const ORI = [[50,100],[0,50],[100,0],[50,0],[0,100],[100,60],[20,20],[50,50]];
  const TYPES = ['circle', 'ring', 'square', 'tri', 'half', 'quarter'];
  const bgc = (n) => `hsl(${n} var(--bs) var(--bl))`, col = (n) => `hsl(${n} var(--ss) var(--sl))`;
  const paint = (el, n) => { if (el.dataset.svg) el.style.color = col(n); else if (el.classList.contains('ring')) el.style.borderColor = col(n); else el.style.background = col(n); };

  function wipe(n, [x, y], ms = 950) {
    const w = h('wipe', '', bg); w.style.background = bgc(n);
    if (RM) { bg.style.background = bgc(n); w.remove(); return; }
    w.animate([{ clipPath: `circle(0px at ${x}% ${y}%)` }, { clipPath: `circle(150vmax at ${x}% ${y}%)` }],
      { duration: ms, easing: 'cubic-bezier(.65,0,.25,1)', fill: 'forwards' }).onfinish = () => { bg.style.background = bgc(n); w.remove(); };
  }
const svg = (b) => `<svg viewBox="0 0 100 100" fill="currentColor">${b}</svg>`;
  const wh = 'fill="#fff" fill-opacity=".5"', st = 'fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"', sw = 'fill="none" stroke="#fff" stroke-opacity=".7" stroke-linecap="round" stroke-linejoin="round"';
  const ICON = {
    bubble: svg(`<path d="M12 16h76a6 6 0 016 6v44a6 6 0 01-6 6H44L26 90V72H12a6 6 0 01-6-6V22a6 6 0 016-6z"/><circle cx="30" cy="44" r="5" ${wh}/><circle cx="50" cy="44" r="5" ${wh}/><circle cx="70" cy="44" r="5" ${wh}/>`),
    window: svg(`<rect x="6" y="14" width="88" height="72" rx="8"/><path d="M6 22a8 8 0 018-8h72a8 8 0 018 8v10H6z" fill="#fff" fill-opacity=".35"/><circle cx="18" cy="23" r="3" fill="#fff"/><circle cx="29" cy="23" r="3" fill="#fff"/><rect x="16" y="44" width="40" height="6" rx="3" ${wh}/><rect x="16" y="58" width="62" height="6" rx="3" ${wh}/>`),
    cursor: svg(`<path d="M22 8l56 34-26 6 16 30-12 6-16-30-18 18z"/>`),
    spark: svg(`<path d="M50 4c4 26 20 42 46 46-26 4-42 20-46 46-4-26-20-42-46-46 26-4 42-20 46-46z"/>`),
    code: svg(`<path d="M34 28L12 50l22 22M66 28l22 22-22 22M56 20L44 80" ${st} stroke-width="9"/>`),
    clock: svg(`<circle cx="50" cy="50" r="42"/><path d="M50 26v26l16 10" ${sw} stroke-width="7"/>`),
    bolt: svg(`<path d="M58 4L18 56h26l-8 40 46-56H54z"/>`),
    sticky: svg(`<path d="M12 12h76v50L62 88H12z"/><path d="M88 62L62 88V62z" fill="#fff" fill-opacity=".5"/><rect x="24" y="30" width="46" height="6" rx="3" ${wh}/><rect x="24" y="44" width="30" height="6" rx="3" ${wh}/>`),
    cup: svg(`<path d="M14 30h60v30a24 24 0 01-24 24H38a24 24 0 01-24-24z"/><path d="M74 38h8a10 10 0 010 24h-8" ${st} stroke-width="7"/><path d="M30 8c-6 6 6 8 0 16M50 8c-6 6 6 8 0 16" ${st} stroke-width="5"/>`),
    laptop: svg(`<rect x="16" y="16" width="68" height="46" rx="6"/><rect x="24" y="24" width="52" height="30" rx="2" fill="#fff" fill-opacity=".45"/><path d="M4 70h92l-6 12H10z"/>`),
    cap: svg(`<path d="M50 14L4 38l46 24 46-24z"/><path d="M24 54v18c0 6 12 12 26 12s26-6 26-12V54L50 68z"/><rect x="88" y="40" width="5" height="26"/>`),
    terminal: svg(`<rect x="6" y="14" width="88" height="72" rx="8"/><path d="M22 36l16 14-16 14" ${sw} stroke-width="7"/><rect x="46" y="62" width="30" height="6" rx="3" fill="#fff" fill-opacity=".75"/>`),
    musicnote: svg(`<path d="M36 10l52-8v60a15 13 0 11-9-12V24L45 31v47a15 13 0 11-9-12z"/>`),
    headphones: svg(`<path d="M14 62V50a36 36 0 0172 0v12" ${st} stroke-width="9"/><rect x="8" y="58" width="20" height="32" rx="8"/><rect x="72" y="58" width="20" height="32" rx="8"/>`),
    keys: svg(`<rect x="6" y="30" width="20" height="56" rx="5"/><rect x="30" y="14" width="20" height="72" rx="5"/><rect x="54" y="38" width="20" height="48" rx="5"/><rect x="78" y="22" width="16" height="64" rx="5"/>`),
    wave: svg(`<rect x="6" y="38" width="10" height="24" rx="5"/><rect x="22" y="20" width="10" height="60" rx="5"/><rect x="38" y="8" width="10" height="84" rx="5"/><rect x="54" y="26" width="10" height="48" rx="5"/><rect x="70" y="14" width="10" height="72" rx="5"/><rect x="86" y="40" width="10" height="20" rx="5"/>`),
    school: svg(`<path d="M50 6L6 32h88z"/><rect x="14" y="36" width="72" height="8"/><rect x="18" y="48" width="12" height="30"/><rect x="44" y="48" width="12" height="30"/><rect x="70" y="48" width="12" height="30"/><rect x="8" y="80" width="84" height="10" rx="2"/>`),
    calendar: svg(`<rect x="8" y="16" width="84" height="76" rx="9"/><path d="M8 25a9 9 0 019-9h66a9 9 0 019 9v13H8z" fill="#fff" fill-opacity=".35"/><rect x="26" y="6" width="8" height="18" rx="4"/><rect x="66" y="6" width="8" height="18" rx="4"/><g ${wh}><rect x="20" y="50" width="12" height="10" rx="2"/><rect x="44" y="50" width="12" height="10" rx="2"/><rect x="68" y="50" width="12" height="10" rx="2"/><rect x="20" y="70" width="12" height="10" rx="2"/><rect x="44" y="70" width="12" height="10" rx="2"/></g>`),
    lock: svg(`<rect x="16" y="42" width="68" height="50" rx="9"/><path d="M30 42V30a20 20 0 0140 0v12" ${st} stroke-width="9"/><circle cx="50" cy="64" r="6" fill="#fff" fill-opacity=".6"/>`),
    trophy: svg(`<path d="M30 10h40v28c0 17-9 28-20 28S30 55 30 38z"/><path d="M30 20H15c0 15 6 25 18 28M70 20h15c0 15-6 25-18 28" ${st} stroke-width="6"/><rect x="44" y="64" width="12" height="16"/><rect x="30" y="80" width="40" height="9" rx="2"/>`),
    medal: svg(`<polygon points="30,4 47,4 59,42 42,42"/><polygon points="70,4 53,4 41,42 58,42"/><circle cx="50" cy="64" r="26"/><circle cx="50" cy="64" r="15" fill="#fff" fill-opacity=".4"/>`),
    star: svg(`<path d="M50 6l13 28 30 4-22 21 6 30-27-15-27 15 6-30L7 38l30-4z"/>`),
    gear: svg(`<circle cx="50" cy="50" r="30"/><rect x="42" y="4" width="16" height="92" rx="3"/><rect x="42" y="4" width="16" height="92" rx="3" transform="rotate(45 50 50)"/><rect x="42" y="4" width="16" height="92" rx="3" transform="rotate(90 50 50)"/><rect x="42" y="4" width="16" height="92" rx="3" transform="rotate(135 50 50)"/><circle cx="50" cy="50" r="12" fill="#fff" fill-opacity=".55"/>`),
    database: svg(`<path d="M12 22v56c0 8 17 14 38 14s38-6 38-14V22z"/><ellipse cx="50" cy="22" rx="38" ry="14"/><path d="M12 46c0 8 17 14 38 14s38-6 38-14M12 68c0 8 17 14 38 14s38-6 38-14" ${sw} stroke-width="5"/>`),
    cube: svg(`<path d="M50 4l40 22v48L50 96 10 74V26z"/><path d="M50 50L10 26M50 50l40-24M50 50v46" ${sw} stroke-width="5"/>`),
    mail: svg(`<rect x="6" y="20" width="88" height="62" rx="9"/><path d="M10 28l40 28 40-28" ${sw} stroke-width="6"/>`),
    plane: svg(`<path d="M94 8L6 44l30 12 10 32 14-22 24 14z"/>`),
    heart: svg(`<path d="M50 90S8 62 8 34a22 22 0 0142-10 22 22 0 0142 10c0 28-42 56-42 56z"/>`),
  };
  const THEME = [
    ['bubble', 'window', 'cursor', 'spark', 'code', 'bubble'],        // hi
    ['clock', 'bolt', 'sticky', 'cup', 'spark', 'window'],            // busy, weird
    ['laptop', 'code', 'cap', 'terminal', 'window', 'spark'],         // roles
    ['musicnote', 'headphones', 'keys', 'wave', 'musicnote', 'window'], // RhythmMania
    ['school', 'window', 'calendar', 'lock', 'cap', 'sticky'],        // school sites
    ['trophy', 'trophy', 'medal', 'medal', 'star', 'star'],           // results
    ['gear', 'database', 'code', 'terminal', 'cube', 'wave'],         // tech stack
    ['mail', 'plane', 'bubble', 'heart', 'spark', 'window'],          // say hi
  ];
  const SLOTS = [[3, 8, 24, -10], [74, 5, 20, 12], [70, 56, 26, 10], [4, 58, 22, -8], [40, 80, 15, 6], [88, 32, 13, -12]];

  function shapes(i) {
    [...shapesEl.children].forEach((o) => {
      o.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: RM ? 'none' : 'scale(0) rotate(80deg)', opacity: 0 }], { duration: 420, easing: 'cubic-bezier(.5,0,.8,.3)', fill: 'forwards' });
      setTimeout(() => o.remove(), 440);
    });

    [4200, (s) => {

    }],
    [4200, (s) => {
      words('Won some stuff.', 'title', s, 0, 70);
      const t = h('ledger', '', s);
      [['NYTC 2026', 'National Youth Tech Championship', 'Champion'], ['NRC 2026', 'National Robotics Games', 'Overall Champion + Best Robot'], ['NJIO 2025', 'National Junior Informatics Olympiad', 'Gold'], ['Bebras 2025, 2026', 'Computational Thinking Challenge', 'Gold, Silver'], ['IJIO 2026', 'International Junior Informatics Olympiad', 'Bronze']]

  const sp0 = spring(0.36, 0.5);
  document.documentElement.style.setProperty('--spr', sp0.easing);
  document.documentElement.style.setProperty('--sprd', sp0.duration + 'ms');

  if (!RM) {
    const P = { x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0 }, pw = (2 * Math.PI) / 0.6, pk = pw * pw, pc = 2 * 0.28 * pw;
    let pl = performance.now();
    addEventListener('pointermove', (e) => { P.tx = (e.clientX / innerWidth - 0.5) * 32; P.ty = (e.clientY / innerHeight - 0.5) * 32; });
    addEventListener('pointerdown', (e) => {
      P.vx += (Math.random() - 0.5) * 700; P.vy += (Math.random() - 0.5) * 700;
      const r = h('ripple', '', document.body); r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px';
      r.animate([{ transform: 'scale(.15)', opacity: 0.8 }, { transform: 'scale(1.7)', opacity: 0 }], { duration: 650, easing: 'cubic-bezier(.1,.7,.3,1)' }).onfinish = () => r.remove();
    });
    (function loop(t) {
      const dt = Math.min((t - pl) / 1000, 1 / 30); pl = t;
      P.vx += (-pk * (P.x - P.tx) - pc * P.vx) * dt; P.vy += (-pk * (P.y - P.ty) - pc * P.vy) * dt;
      P.x += P.vx * dt; P.y += P.vy * dt;
      for (const w of shapesEl.children) if (w.dataset.d) w.style.translate = `${P.x * w.dataset.d}px ${P.y * w.dataset.d}px`;
      requestAnimationFrame(loop);
    })(pl);
  }

  scenes.forEach((_, i) => { const b = h('dot', '', dots, 'button'); b.setAttribute('aria-label', 'Scene ' + (i + 1)); b.onclick = () => go(i); });

  async function go(i = 0) {
    const id = ++run;
    stage.innerHTML = '';
    for (; i < scenes.length; i++) {
      if (id !== run) return;
      cur = i; [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
      const [dur, build] = scenes[i]; mood(i, id, dur);
      const s = h('scene', '', stage);
      build(s);
      if (!dur) return;
      await sleep(dur); if (id !== run) return;
      s.animate(RM ? [{ opacity: 1 }, { opacity: 0 }] : [{ opacity: 1, transform: 'none' }, { opacity: 1, transform: 'scale(1.04)', offset: 0.25 }, { opacity: 0, transform: 'translateY(-50px) scale(.86)' }], { duration: 420, easing: 'cubic-bezier(.4,0,.8,.4)', fill: 'forwards' });
      await sleep(400); s.remove();
    }
  }
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') go(Math.min(cur + 1, scenes.length - 1));
    if (e.key === 'ArrowLeft') go(Math.max(cur - 1, 0));
    if (e.key.toLowerCase() === 'r') go(0);
  });
  go(0);
})();
